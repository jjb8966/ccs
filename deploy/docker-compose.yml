# CCS stack: dashboard + CLIProxy (Cursor via Plus backend)
# Usage: from repo root — ./run-dev.sh

services:
  ccs:
    image: ${CCS_IMAGE:-ccs-local:cursor-supervisor}
    build:
      context: ../docker
      dockerfile: Dockerfile.integrated
      args:
        CCS_NPM_VERSION: ${CCS_NPM_VERSION:-latest}
    container_name: ccs
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${CCS_CLIPROXY_PORT:-8317}:8317"
      - "${CCS_DASHBOARD_PORT:-3000}:3000"
      - "${CCS_CURSOR_DAEMON_PORT:-20129}:20129"
    environment:
      ANTHROPIC_AUTH_TOKEN: ${CCS_PROXY_TOKEN}
      CCS_PROXY_TOKEN: ${CCS_PROXY_TOKEN}
      CCS_CURSOR_FIRST_BYTE_TIMEOUT_MS: ${CCS_CURSOR_FIRST_BYTE_TIMEOUT_MS:-30000}
      CCS_CURSOR_BIND_HOST: ${CCS_CURSOR_BIND_HOST:-0.0.0.0}
    volumes:
      - ./state/.ccs:/root/.ccs
      - ccs_logs:/var/log/ccs
      - ../dist/cursor:/usr/local/lib/node_modules/@kaitranntt/ccs/dist/cursor:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('net'); const ports=[3000,8317,20129]; let pending=ports.length; let ok=true; for (const port of ports) { const socket=net.connect(port,'127.0.0.1',()=>done(true)); socket.setTimeout(2500,()=>done(false)); socket.on('error',()=>done(false)); function done(result){ if (socket.destroyed) return; ok = ok && result; socket.destroy(); if (--pending === 0) process.exit(ok ? 0 : 1); } } setTimeout(()=>process.exit(1),3000);"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default
      - nginx-network

volumes:
  ccs_logs:

networks:
  nginx-network:
    external: true
