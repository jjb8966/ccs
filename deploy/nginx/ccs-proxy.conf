# Include inside the jjb8966.duckdns.org server { } block (same pattern as ollama-proxy).
# Requires ccs on docker network "nginx-network" (run-dev.sh connects it).
#
#   include /path/to/ccs/deploy/nginx/ccs-proxy.conf;

location = /ccs {
    return 301 /ccs/;
}

# Native CCS cursor daemon (chat, messages, Ollama metadata)
location /ccs/api/provider/cursor/ {
    set $ccs_cursor_upstream ccs;
    rewrite ^/ccs/api/provider/cursor/(.*)$ /$1 break;
    proxy_pass http://$ccs_cursor_upstream:20129;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ccs/api/provider/cursor;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Dashboard and other CCS routes stay on CLIProxy Plus
location /ccs/ {
    set $ccs_upstream ccs;
    rewrite ^/ccs/(.*)$ /$1 break;
    proxy_pass http://$ccs_upstream:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /ccs;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
